{% extends 'base.html' %}

{% block title %}Face Scan Login - Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="glass-card p-5">
            <h2 class="h3 fw-bold text-white mb-2">Student Face Scan</h2>
            <p class="text-secondary mb-4">Please look directly into the camera to authenticate.</p>
            
            <div id="webcam-wrapper" class="webcam-wrapper mb-4">
                <!-- Webcam streaming video element -->
                <video id="webcam" class="webcam-stream" autoplay playsinline muted></video>
                <!-- Scan Overlay -->
                <div class="scan-overlay">
                    <div class="scan-line"></div>
                </div>
            </div>
            
            <div id="status-card" class="p-3 mb-4 rounded-3 text-secondary font-monospace border" style="background: rgba(0,0,0,0.2); border-color: var(--border-color) !important;">
                <span id="status-text">Checking camera permissions...</span>
            </div>
            
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-outline-light px-4"><i class="fas fa-arrow-left me-2"></i> Cancel</a>
                <button onclick="window.location.reload();" class="btn btn-primary-custom px-4"><i class="fas fa-sync me-2"></i> Restart Scanner</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
